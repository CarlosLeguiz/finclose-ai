[project]
name = "finclose-ai"
version = "0.1.0"
description = "Automated financial close and variance analysis pipeline with AI-generated executive commentary"
authors = [
    {name = "Carlos Leguizamon Guillaumet",email = "carlosleguizamonguillaumet1998@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "faker (>=40.19.1,<41.0.0)",
    # pandas pinned to v2.x — see docs/decisions/0001-pin-pandas-to-v2.md
    "pandas (>=2.2.0,<3.0.0)",
    "dbt-core (>=1.10,<2.0)",
    "dbt-duckdb (>=1.10,<2.0)",
    "streamlit (>=1.58.0,<2.0.0)",
    "duckdb (>=1.5.3,<2.0.0)",
    "plotly (>=6.8.0,<7.0.0)",
    "langchain (>=1.3.7,<2.0.0)",
    "langchain-anthropic (>=1.4.5,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "duckdb-engine (>=0.17.0,<0.18.0)",
    "langchain-openai (>=1.3.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "black (>=24.0,<25.0)"
]
